name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tested Hermes Agent 0.20.1 runtime
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "${RUNNER_TEMP}/hermes-agent"
          git -C "${RUNNER_TEMP}/hermes-agent" checkout c896c09c42910c584c4c7d2325b58c14713ea42c
          python -m pip install -e "${RUNNER_TEMP}/hermes-agent"
      - name: Compile
        run: python -m py_compile adapter.py test_adapter.py test_lifecycle_real.py
      - name: Combined unit and real lifecycle tests
        run: python -m unittest -q test_adapter test_lifecycle_real
      - name: Plugin doctor
        run: hermes plugins doctor --ci .
